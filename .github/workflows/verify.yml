name: Verify dashboard
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify JavaScript syntax
        run: |
          node --check app.js
          node --check planning.js
          node --check meta.js
          node --check concept3.js
          node --check audit.js
          node --check studio.js
          node --check metric-editor.js
          node --check style-engine.js
          node --check photo-editor.js
          node --check access.js
          node --check api/auth.js
          node --check api/users.js
          node --check lib/editor-auth.mjs
          node --check builder.js
          node --check looker-filter-engine.js
          node --check looker-editor.js
          node --check looker-properties.js
          node --check free-layout.js
          node --check layout-assist.js
          node --check report-templates.js
          node --check period-compare.js
          node --check compare-lab.js
          node --check alert-engine.js
          node --check alert-center.js
          node --check api/dashboard.js
          node --check api/data-connect.js
          node --check lib/sheets-connector.mjs
          node --check api/campaign-sync.js
          node --check lib/campaign-data.mjs
          node --check lib/campaign-apps-script.mjs
          node --check campaign-feed.js
          node --check campaign-connection.js
          node --check campaign-creatives.js
          node --check data-sources.js
          node --check source-data.js
          node --check api/history.js
          node --check api/media.js
          node --check data/revision_2026.js
      - name: Verify structure and no simulated data
        run: node scripts/verify.cjs
      - name: Install lightweight DOM test runner
        run: npm install --no-save --no-package-lock jsdom@25
      - name: Validate report-template fields and overlap-free layouts
        run: node scripts/smoke-report-templates.cjs
      - name: Browser-like smoke test of Planning 2026
        run: node scripts/smoke-planning.cjs
      - name: Browser-like audit detail test
        run: node scripts/smoke-audit.cjs
      - name: Browser-like custom Studio editor test
        run: node scripts/smoke-studio.cjs
      - name: Browser-like metric inspector real data test
        run: node scripts/smoke-metrics.cjs
      - name: Browser-like advanced visual editor
        run: node scripts/smoke-style.cjs
      - name: Browser-like chart gallery and vehicle photo editor
        run: node scripts/smoke-gallery.cjs
      - name: Browser-like secured Design authentication and master users
        run: node scripts/smoke-access.cjs
      - name: Public page builder, creatives, insights, filter and free-canvas regression
        run: node scripts/smoke-builder.cjs
      - name: Advanced Looker filter dates, scopes and operator math
        run: node scripts/smoke-lookers.cjs

      - name: Looker-style editor workspace, insertion and view-mode regression
        run: node scripts/smoke-looker-editor.cjs
      - name: Looker contextual chart editing, canvas zoom and reader isolation
        run: node scripts/smoke-looker-properties.cjs
      - name: Alert rule calculations, boundaries and missing-data semantics
        run: node scripts/smoke-alerts.cjs
      - name: Manual A/B comparison by model and territory
        run: node scripts/smoke-compare-lab.cjs
      - name: Grounded month-to-date comparison math
        run: node scripts/smoke-period-comparison.cjs
      - name: Magnetic guidelines, alignment and undo/redo history
        run: node scripts/smoke-layout-assist.cjs
      - name: Direct drag and corner resize KPIs + Summary graphs
        run: node scripts/smoke-direct-layout.cjs
      - name: Shared image references and protected history UI
        run: node scripts/smoke-media-version.cjs

      - name: Sheets connector URLs, access, CSV and bounded reads
        run: node --test scripts/test-sheets.mjs
      - name: Connected source editor and privacy regression
        run: node scripts/smoke-sources.cjs

      - name: Full campaign sync, authorization and source reconciliation
        run: node --test scripts/test-campaign-sync.mjs
      - name: Shared campaign feed and connection activation UI
        run: node scripts/smoke-campaign-sync.cjs
      - name: Connected ad images, filters and metric identity
        run: node scripts/smoke-campaign-creatives.cjs
