name: Verify dashboard
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify JavaScript syntax
        run: |
          node --check app.js
          node --check planning.js
          node --check meta.js
          node --check concept3.js
          node --check audit.js
          node --check studio.js
          node --check metric-editor.js
          node --check style-engine.js
          node --check photo-editor.js
          node --check access.js
          node --check api/auth.js
          node --check api/users.js
          node --check lib/editor-auth.mjs
          node --check builder.js
          node --check looker-filter-engine.js
          node --check looker-editor.js
          node --check free-layout.js
          node --check api/dashboard.js
          node --check api/data-connect.js
          node --check data/revision_2026.js
      - name: Verify structure and no simulated data
        run: node scripts/verify.cjs
      - name: Install lightweight DOM test runner
        run: npm install --no-save --no-package-lock jsdom@25
      - name: Browser-like smoke test of Planning 2026
        run: node scripts/smoke-planning.cjs
      - name: Browser-like audit detail test
        run: node scripts/smoke-audit.cjs
      - name: Browser-like custom Studio editor test
        run: node scripts/smoke-studio.cjs
      - name: Browser-like metric inspector real data test
        run: node scripts/smoke-metrics.cjs
      - name: Browser-like advanced visual editor
        run: node scripts/smoke-style.cjs
      - name: Browser-like chart gallery and vehicle photo editor
        run: node scripts/smoke-gallery.cjs
      - name: Browser-like secured Design authentication and master users
        run: node scripts/smoke-access.cjs
      - name: Public page builder, creatives, insights, filter and free-canvas regression
        run: node scripts/smoke-builder.cjs
      - name: Advanced Looker filter dates, scopes and operator math
        run: node scripts/smoke-lookers.cjs

      - name: Looker-style editor workspace, insertion and view-mode regression
        run: node scripts/smoke-looker-editor.cjs
